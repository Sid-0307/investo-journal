name: Investo journal build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Republish saved data or append a sourced correction
        type: choice
        options: [publish, correction]
        required: true
        default: publish
      correction_reason:
        description: Required when operation is correction
        type: string
        required: false
      correction_source_url:
        description: Required HTTPS source when operation is correction
        type: string
        required: false
      corrects_report:
        description: Report ID being corrected
        type: string
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: investo-pages
  cancel-in-progress: false
jobs:
  publish-journal:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select operation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "INVESTO_OPERATION=${{ inputs.operation }}" >> "$GITHUB_ENV"
          else
            echo "INVESTO_OPERATION=publish" >> "$GITHUB_ENV"
          fi
      - name: Append sourced correction
        if: env.INVESTO_OPERATION == 'correction'
        env:
          INVESTO_CORRECTION_REASON: ${{ inputs.correction_reason }}
          INVESTO_CORRECTION_SOURCE_URL: ${{ inputs.correction_source_url }}
          INVESTO_CORRECTS_REPORT: ${{ inputs.corrects_report }}
        run: npm run correction
      - name: Audit corrected journal
        if: env.INVESTO_OPERATION == 'correction'
        run: npm run audit
      - name: Validate correction and journal records
        if: env.INVESTO_OPERATION == 'correction'
        run: npm test
      - name: Save correction and audit
        if: env.INVESTO_OPERATION == 'correction'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports data/audits
          if ! git diff --cached --quiet; then
            git commit -m "journal: append sourced correction"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Validate journal data and invariants
        run: npm test
      - name: Build public site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
